# Fly.io: the game server (server.js). One always-on machine: rooms and clocks live in
# memory, so it must not sleep or run as several copies. Quiz levels/standings go to the
# volume so deploys don't wipe them.
app = "tiktako"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  QZ_STATS_FILE = "/data/quiz-stats.json"

[mounts]
  source = "tiktako_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
