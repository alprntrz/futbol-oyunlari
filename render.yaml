# Render Blueprint: the game server (server.js = Next site + Socket.IO for online play).
# Render dashboard → New → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: tiktako
    runtime: node
    region: frankfurt
    # Starter: always on (free instances sleep, which drops live games) and allows a disk
    plan: starter
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Quiz levels / standings live on the persistent disk so deploys don't wipe them
      - key: QZ_STATS_FILE
        value: /var/data/quiz-stats.json
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
